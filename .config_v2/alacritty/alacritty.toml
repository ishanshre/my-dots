
[font]
size = 11.0

[font.bold]
family = "ComicShannsMonoNerdFont"
style = "Bold"

[font.bold_italic]
family = "ComicShannsMonoNerdFont"
style = "Bold Italic"

[font.italic]
family = "ComicShannsMonoNerdFont"
style = "Italic"

[font.normal]
family = "ComicShannsMonoNerdFont"
style = "Regular"

[window]
padding = { x = 0, y = 0 }
dynamic_padding = true
decorations = "None"
blur = true

[general]
# import = ["~/.config/alacritty/cyberdream.toml"]
# import = ["~/.config/alacritty/dracula.toml"]
import = ["~/.config/alacritty/catppuccin.toml"]


[keyboard]
bindings = [{key = 'x', mods = "Alt", action = "None"}]


